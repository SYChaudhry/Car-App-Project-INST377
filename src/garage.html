<!-- garage.html - Garage page for the Gearly car maintenance web application. Allows users to manage their vehicles. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Gearly | Garage </title>

    <link rel="stylesheet" href="/css/styles.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="/js/garage.js"></script>
  </head>

  <body>
    <nav>
      <h2> Gearly </h2>

      <div>
        <a href="/"> Dashboard </a>
        <a href="/garage"> Garage </a>
        <a href="/service-history"> Service History </a>
        <a href="/nearby-shops"> Nearby Shops </a>
        <a href="/about"> About </a>
      </div>
    </nav>

    <main class="container">
      <section class="page-header">
        <h1> Garage </h1>
        <p>
          Add and manage vehicles that you want to track in Gearly.
        </p>
      </section>

      <section class="card">
        <h2> Add Vehicle </h2>

        <form id="vehicleForm">
          <label for="year"> Year </label>
          <input type="number" id="year" placeholder="Example: 2020" required />

          <label for="make"> Make </label>
          <input id="make" placeholder="Example: Honda" required />

          <label for="model"> Model </label>
          <input id="model" placeholder="Example: Civic" required />

          <label for="mileage"> Current Mileage </label>
          <input
            type="number"
            id="mileage"
            placeholder="Example: 45000"
            required
          />

          <button type="submit"> Save Vehicle </button>
        </form>
      </section>

      <section class="card">
        <h2> Saved Vehicles </h2>
        <p>
          Vehicles you add will appear here.
        </p>

        <div id="vehicleList">
          <p> No vehicles saved yet. </p>
        </div>
      </section>
    </main>
  </body>
</html>
