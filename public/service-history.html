<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gearly | Service History</title>
    <link rel="stylesheet" href="/css/styles.css" />

    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="/js/charts.js"></script>
    <script defer src="/js/service-history.js"></script>
  </head>

  <body>
    <nav>
      <h2>Gearly</h2>
      <div>
        <a href="/">Dashboard</a>
        <a href="/garage">Garage</a>
        <a href="/service-history">Service History</a>
        <a href="/about">About</a>
      </div>
    </nav>

    <main class="container">
      <section class="page-header">
        <h1>Service History</h1>
      </section>

      <section class="card">
        <h2>Add Service Record</h2>

        <form id="serviceForm">
          <label for="serviceVehicle">Vehicle</label>
          <select id="serviceVehicle" required>
            <option value="">Select a vehicle from your garage</option>
          </select>

          <label for="serviceType">Service Type</label>
          <input id="serviceType" required />

          <label for="serviceDate">Service Date</label>
          <input type="date" id="serviceDate" required />

          <label for="serviceMileage">Mileage at Service</label>
          <input type="number" id="serviceMileage" required />

          <label for="serviceCost">Cost</label>
          <input type="number" id="serviceCost" required />

          <label for="serviceNotes">Notes</label>
          <input id="serviceNotes" />

          <button type="submit">Add Service</button>
        </form>
      </section>

      <section class="card">
        <h2>Service Records</h2>
        <div id="serviceList"></div>
      </section>

      <section class="card">
        <h2>Service Cost Chart</h2>
        <canvas id="serviceCostChart"></canvas>
      </section>
    </main>
  </body>
</html>
