<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gearly | Add Vehicle</title>
    <link rel="stylesheet" href="/css/styles.css" />

    <script defer src="/js/charts.js"></script>
    <script defer src="/js/garage.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
  </head>
  <body>
    <nav>
      <h2>Gearly</h2>
      <div>
        <a href="/">Dashboard</a>
        <a href="/garage">Garage</a>
        <a href="/about">About</a>
      </div>
    </nav>

    <main class="container">
      <section class="page-header">
        <h1>Add Vehicle / Garage</h1>
      </section>

      <section class="card">
        <h2>Add Vehicle</h2>

        <form id="vehicleForm" autocomplete="off">
          <label for="year">Year</label>
          <input list="yearOptions" id="year" required />
          <datalist id="yearOptions"></datalist>

          <label for="make">Make</label>
          <input list="makeOptions" id="make" required />
          <datalist id="makeOptions"></datalist>

          <label for="model">Model</label>
          <input list="modelOptions" id="model" required />
          <datalist id="modelOptions"></datalist>

          <label for="mileage">Current Mileage</label>
          <input type="number" id="mileage" required />

          <button type="submit">Save Vehicle</button>
        </form>
      </section>

      <section class="card">
        <h2>Saved Vehicles</h2>
        
        <div id="vehicleList"></div>
      </section>

      <section class="card">
        <h2>Vehicle Mileage Chart</h2>
        <p>This chart compares the mileage of vehicles saved in your garage.</p>
        <canvas id="mileageChart"></canvas>
      </section>
    </main>
  </body>
</html>
